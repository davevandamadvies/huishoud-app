{% extends "base.html" %}
{% block content %}
<header>
  <h1 class="page-title">Je bent offline</h1>
</header>
<div class="card" data-offline>
  <p>Je telefoon kan de app nu niet bereiken. Staat Tailscale aan en is die verbonden? Zodra de app weer bereikbaar is, ga je vanzelf verder.</p>
  <p class="muted" data-offline-status role="status" aria-live="polite"></p>

</div>
{% endblock %}
