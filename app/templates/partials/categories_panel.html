<div id="categories-panel" class="stack">
  {% include "partials/messages.html" %}
  {% if categories %}
  <ul class="list">
    {% for c in categories %}
    <li>
      <a class="list-item list-link" href="/categorieen/{{ c.id }}">
        <span class="dot cat-{{ c.color }}" aria-hidden="true"></span>
        <span class="item-title">{{ c.name }}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <div class="empty-state"><strong>Nog geen categorieën</strong>Voeg er hieronder een toe.</div>
  {% endif %}

  <section>
    <h2 class="section-title" id="new-category">Nieuwe categorie</h2>
    <form class="card form" hx-post="/categorieen" hx-target="#categories-panel" hx-swap="outerHTML" aria-labelledby="new-category">
      <div class="field">
        <label class="label" for="name">Naam</label>
        <input class="input" id="name" name="name" required maxlength="40" value="{{ form.name or '' }}">
      </div>
      {% include "partials/color_picker.html" %}
      <button class="button" type="submit">Toevoegen</button>
    </form>
  </section>
</div>
