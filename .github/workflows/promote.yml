name: promote

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest (sha256:...) om als 'stable' (productie) te markeren"
        required: true
        type: string

permissions: {}

jobs:
  promote:
    name: Promote to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Validate digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Ongeldige digest"; exit 1; }
      - name: Verify attestation
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://ghcr.io/davevandamadvies/huishoud-app@${DIGEST}" --owner davevandamadvies
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag digest as stable
        env:
          DIGEST: ${{ inputs.digest }}
        run: docker buildx imagetools create -t ghcr.io/davevandamadvies/huishoud-app:stable "ghcr.io/davevandamadvies/huishoud-app@${DIGEST}"
